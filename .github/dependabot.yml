# Actualización de dependencias (docs/security-model.md §9).
#
# Las de seguridad llegan solas y de inmediato; las de rutina se agrupan
# semanalmente para no generar ruido de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
        exclude-patterns:
          # React Native versiona 0.x: un salto 0.76 → 0.86 es efectivamente mayor,
          # y su versión la determina el SDK de Expo, no se elige por separado.
          # Agrupado como "minor" atraviesa el pipeline sin ruido porque apps/mobile
          # todavía no tiene build real. Va suelto para que se revise a mano.
          - 'react-native'
          - 'react-native-*'
          - 'expo'
          - 'expo-*'
          - '@expo/*'
    # Prisma sube cliente y CLI por separado; actualizarlos desacoplados rompe la
    # generación. Se revisan juntos y a mano.
    ignore:
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
    labels: ['dependencias']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['dependencias', 'ci']

  - package-ecosystem: docker
    directory: '/infrastructure/docker'
    schedule:
      interval: monthly
    labels: ['dependencias', 'infraestructura']
