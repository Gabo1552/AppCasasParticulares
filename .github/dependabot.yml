# Actualización de dependencias (docs/security-model.md §9).
#
# Las de seguridad llegan solas y de inmediato; las de rutina se agrupan
# semanalmente para no generar ruido de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
      production-minor-patch:
        dependency-type: production
        update-types: ['minor', 'patch']
        exclude-patterns:
          # React Native versiona 0.x: un salto 0.76 → 0.86 es efectivamente mayor,
          # y su versión la determina el SDK de Expo, no se elige por separado.
          # Agrupado como "minor" atraviesa el pipeline sin ruido porque apps/mobile
          # todavía no tiene build real. Va suelto para que se revise a mano.
          - 'react-native'
          - 'react-native-*'
          - 'expo'
          - 'expo-*'
          - '@expo/*'
    # Majores que no son un bump sino una migración. Dependabot los vuelve a
    # abrir cada semana y cada vez hay que rechazarlos con el mismo análisis, así
    # que se ignoran hasta que se aborden como tarea propia. Cada entrada dice por
    # qué; borrar la línea es lo que habilita la actualización.
    ignore:
      # Cliente y CLI se suben juntos o rompe la generación. Además el 7 exige
      # prisma.config.ts, quitar `url` del datasource y adaptar los exports.
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']

      # La versión de React Native y de todo el árbol de Expo la determina el SDK
      # de Expo, no se eligen por separado. Actualizar el SDK es la tarea; estos
      # paquetes vienen con él.
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'

      # zod 4 cambia la semántica de .default() sobre .transform(): pasa a esperar
      # el tipo de salida. En este proyecto eso hacía que los feature flags
      # tomaran el valor equivocado y se resolviera el conector oficial de ARCA,
      # que debe estar deshabilitado. Migrar exige revisar cada .default().
      - dependency-name: 'zod'
        update-types: ['version-update:semver-major']
    labels: ['dependencias']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: ['dependencias', 'ci']

  - package-ecosystem: docker
    directory: '/infrastructure/docker'
    schedule:
      interval: monthly
    labels: ['dependencias', 'infraestructura']
