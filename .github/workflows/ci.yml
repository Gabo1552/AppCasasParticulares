name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # ── Verificación de los principios del encargo ────────────────────────────
  # Corre primero y sin dependencias pesadas: si alguien introdujo un campo de
  # clave fiscal o un Float para dinero, conviene saberlo en 30 segundos.
  guardrails:
    name: Principios del encargo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Sin pnpm ni caché a propósito: el script sólo usa Node y el sistema de
      # archivos, no instala nada. Pedir `cache: pnpm` acá hacía fallar el job en
      # la limpieza, porque el store de pnpm nunca llega a existir.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verificar principios (claves fiscales, scraping, float, custodia)
        run: node scripts/guardrails.mjs

  quality:
    name: Lint, typecheck, pruebas y build
    runs-on: ubuntu-latest
    needs: guardrails

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: casas
          POSTGRES_PASSWORD: casas_ci_password
          POSTGRES_DB: casas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://casas:casas_ci_password@localhost:5432/casas?schema=public
      SHADOW_DATABASE_URL: postgresql://casas:casas_ci_password@localhost:5432/casas_shadow?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      API_BASE_URL: http://localhost:3001
      WEB_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: casas-documents
      STORAGE_ACCESS_KEY: ci_access
      STORAGE_SECRET_KEY: ci_secret
      # Secretos de CI, generados para el pipeline. No se usan en ningún entorno real.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      FIELD_ENCRYPTION_KEY: ci-only-field-encryption-key-32-chars
      FIELD_ENCRYPTION_KEY_ID: ci-key-1
      # Se hornea en el bundle de Next durante el build, así que tiene que estar
      # antes del paso de build, no sólo al levantar el servidor.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Instalación reproducible: el lockfile manda.
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm db:generate

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas unitarias
        run: pnpm test

      - name: Build
        run: pnpm build

      # Verificación de migraciones: aplica las migraciones sobre una base limpia
      # y comprueba que el esquema resultante coincide con schema.prisma. Detecta
      # una migración olvidada o desincronizada.
      - name: Crear base shadow
        run: |
          PGPASSWORD=casas_ci_password psql -h localhost -U casas -d casas \
            -c "CREATE DATABASE casas_shadow OWNER casas;"

      - name: Aplicar migraciones
        run: pnpm --filter @casas/database exec prisma migrate deploy

      - name: Verificar que el esquema coincide con las migraciones
        run: |
          pnpm --filter @casas/database exec prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code \
          && echo "El esquema coincide con las migraciones." \
          || (echo "::error::schema.prisma tiene cambios sin migración. Ejecutá 'pnpm db:migrate'." && exit 1)

      - name: Seeds de demostración
        run: pnpm db:seed

      - name: Pruebas de integración
        run: pnpm test:integration

      # E2E: navegador real contra la API y la web servidas de verdad. Es lo
      # único que verifica el recorrido tal como lo vive una persona; las
      # pruebas de integración cubren la API, no la interfaz.
      - name: Instalar Chromium para Playwright
        run: pnpm --filter @casas/web exec playwright install --with-deps chromium

      - name: Levantar la API
        run: |
          node apps/api/dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001/health && break
            sleep 2
          done
          curl -sf http://localhost:3001/health || (echo "::error::La API no arrancó" && cat /tmp/api.log && exit 1)
        env:
          PORT: '3001'
          # Habilita /test-support/*, que le da al E2E los códigos y los enlaces
          # sin leer un buzón. La API se niega a arrancar con este flag encendido
          # si NODE_ENV=production.
          FEATURE_TEST_SUPPORT_ENDPOINTS: 'true'
          SMTP_HOST: localhost
          SMTP_PORT: '1025'

      - name: Levantar la web
        run: |
          pnpm --filter @casas/web exec next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/ > /dev/null || (echo "::error::La web no arrancó" && cat /tmp/web.log && exit 1)

      - name: Pruebas de extremo a extremo
        run: pnpm --filter @casas/web run test:e2e

      - name: Guardar el reporte de Playwright si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  dependencies:
    name: Escaneo de dependencias
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Falla ante vulnerabilidades altas o críticas (docs/security-model.md §9).
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high
